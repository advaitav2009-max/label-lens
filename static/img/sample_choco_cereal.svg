<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="cerealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#935B32" />
      <stop offset="100%" stop-color="#5B331A" />
    </linearGradient>
  </defs>
  <!-- Box Body -->
  <rect x="25" y="20" width="150" height="200" rx="10" fill="url(#boxGrad)" stroke="#64748B" stroke-width="2"/>
  <!-- Front Banner -->
  <rect x="35" y="35" width="130" height="40" rx="6" fill="#DC2626"/>
  <text x="100" y="58" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#FFFFFF" text-anchor="middle">CHOCO CRUNCH</text>
  <!-- Splash / Bowl -->
  <circle cx="100" cy="125" r="38" fill="url(#cerealGrad)"/>
  <circle cx="90" cy="118" r="8" fill="#FBBF24" opacity="0.8"/>
  <circle cx="112" cy="124" r="7" fill="#FBBF24" opacity="0.8"/>
  <circle cx="100" cy="138" r="9" fill="#FBBF24" opacity="0.8"/>
  <!-- Label tag behind -->
  <rect x="35" y="175" width="130" height="35" rx="4" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="100" y="190" font-family="Arial, sans-serif" font-size="8" fill="#94A3B8" text-anchor="middle">INGREDIENTS: CORN, SUGAR, PALM</text>
  <text x="100" y="202" font-family="Arial, sans-serif" font-size="8" fill="#F87171" text-anchor="middle">INS 150d, INS 321, SOY</text>
</svg>