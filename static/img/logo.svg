<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>
  <!-- Frame -->
  <rect x="8" y="8" width="84" height="84" rx="20" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />
  <!-- Optical Lens Ring -->
  <circle cx="50" cy="50" r="26" fill="#080C14" stroke="url(#ringGrad)" stroke-width="3.5" />
  <circle cx="50" cy="50" r="18" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="3 2" />
  <!-- Reticle Crosshairs -->
  <line x1="50" y1="20" x2="50" y2="28" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="72" x2="50" y2="80" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" />
  <line x1="20" y1="50" x2="28" y2="50" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" />
  <line x1="72" y1="50" x2="80" y2="50" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" />
  <!-- Center Sensor Dot -->
  <circle cx="50" cy="50" r="3.5" fill="#3B82F6" />
</svg>
