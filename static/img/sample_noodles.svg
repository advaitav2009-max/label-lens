  <text x="100" y="177" font-family="Arial, sans-serif" font-size="7" fill="#FCA5A5" text-anchor="middle">Refined Palm Oil • MSG INS 621</text>
  <text x="100" y="188" font-family="Arial, sans-serif" font-size="7" fill="#FCA5A5" text-anchor="middle">Maida • TBHQ INS 319</text>
